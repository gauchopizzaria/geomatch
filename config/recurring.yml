# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  expire_subscriptions:
    class: ExpireSubscriptionsJob
    queue: default
    schedule: every day at 3am
  bolsao_reconciliation:
    class: BolsaoReconciliationJob
    queue: default
    schedule: every day at 3am
  # Saques com Pix enviado ao Mercado Pago: confirma e dá baixa nos que compensaram.
  # (config/schedule.yml é do Sidekiq, que não roda em produção — lá o Solid Queue só
  # lê este arquivo)
  check_pending_payouts:
    class: CheckPendingPayoutsJob
    queue: default
    schedule: every 10 minutes
